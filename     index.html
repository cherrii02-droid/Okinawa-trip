{date:'11/26',dow:'四',name:'那霸自由行',sub:'達摩寺・首里城・市場・新都心・夕陽・燒肉',label:'自由活動 Day 3',note:'白天以單軌為主；有長輩與幼兒，首里站往首里城有坡道，步行吃力時可局部改搭計程車。下午購物請 DFS／Main Place 擇一，才能趕上瀨長島夕陽。',events:[

let day=0,filter='全部';const kinds=['全部','景點','美食','購物','交通','休息'];const emojis={'景點':'📍','美食':'🍜','購物':'🛍️','交通':'🚝','休息':'🏨'};const cls={'美食':'food','購物':'shop','交通':'move'};function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}function render(){document.getElementById('days').innerHTML=D.map((d,i)=>`<button class="day ${i===day?'active':''}" onclick="setDay(${i})"><b>${d.date}</b><small>${['二','三','四','五'][i]} · Day ${i+1}</small></button>`).join('');let d=D[day];document.getElementById('content').innerHTML=`<div class="heading"><div><h2>${d.name}</h2><p>${d.sub}</p></div><span class="tag">${d.label}</span></div><div class="notice">💡 ${d.note}</div><div class="filter">${kinds.map(k=>`<button class="${filter===k?'on':''}" onclick="setFilter('${k}')">${k==='全部'?'全部行程':emojis[k]+' '+k}</button>`).join('')}</div><div id="events">${d.events.map((e,i)=>{let [time,name,kind,desc,place]=e;if(filter!=='全部'&&filter!==kind)return '';let id=`d${day}e${i}`,done=localStorage.getItem(id)==='1';return `<div class="item"><article class="event ${done?'done':''}" id="${id}"><div class="eventtop"><div class="time">${time}</div><div class="eventbody"><h3>${emojis[kind]} ${name}</h3><div class="meta"><span class="kind ${cls[kind]||''}">${kind}</span>${desc.slice(0,29)}${desc.length>29?'…':''}</div><div class="check"><input type="checkbox" aria-label="完成 ${name}" ${done?'checked':''} onchange="mark('${id}',this.checked)"><span>已完成</span></div></div><button class="toggle" onclick="expand('${id}')">詳情⌄</button></div><div class="details" id="detail-${id}">${desc}<div class="links">${place?`<a href="${maps(place)}" target="_blank" rel="noopener">📍 Google 地圖 ↗</a>`:''}<a href="https://www.google.com/search?q=${encodeURIComponent(name+' 沖繩 營業時間')}" target="_blank" rel="noopener">🔎 查詢資訊 ↗</a></div></div></article></div>`}).join('')}</div>`}function setDay(i){day=i;filter='全部';render();window.scrollTo({top:0,behavior:'smooth'})}function setFilter(k){filter=k;render()}function expand(id){document.getElementById('detail-'+id).classList.toggle('open')}function mark(id,v){localStorage.setItem(id,v?'1':'0');document.getElementById(id).classList.toggle('done',v)}async function shareTrip(){if(navigator.share){try{await navigator.share({title:document.title,url:location.href});return}catch(e){}}try{await navigator.clipboard.writeText(location.href);alert('已複製網頁連結')}catch(e){alert('請使用瀏覽器的分享功能儲存此頁')}}render();
</script></body></html>
